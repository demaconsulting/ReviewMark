<svg xmlns="http://www.w3.org/2000/svg" width="1346" height="352" viewBox="0 0 1346 352" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <!-- Transparent canvas; a white rounded card keeps the diagram readable in light and dark themes -->
  <rect x="14" y="16" width="1322" height="330" rx="28" fill="#d5dce6"/>
  <rect x="10" y="10" width="1322" height="330" rx="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

  <g transform="translate(35,34)">
    <!-- Step 1: define review sets -->
    <rect x="0" y="0" width="232" height="260" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="116" y="30" font-size="16" font-weight="600" fill="#1e3a8a" text-anchor="middle">1. Define review sets</text>
    <rect x="14" y="46" width="204" height="58" rx="6" fill="#ffffff" stroke="#2563eb"/>
    <text x="116" y="70" font-size="14" font-weight="600" font-family="Consolas, monospace" fill="#1e3a8a" text-anchor="middle">.reviewmark.yaml</text>
    <text x="116" y="90" font-size="12" fill="#1e40af" text-anchor="middle">needs-review globs, review sets</text>
    <rect x="14" y="114" width="204" height="58" rx="6" fill="#ffffff" stroke="#2563eb"/>
    <text x="116" y="138" font-size="14" font-weight="600" fill="#1e3a8a" text-anchor="middle">Evidence source</text>
    <text x="116" y="158" font-size="12" fill="#1e40af" text-anchor="middle">url, fileshare, or none</text>
    <rect x="14" y="182" width="204" height="58" rx="6" fill="#ffffff" stroke="#2563eb"/>
    <text x="116" y="206" font-size="14" font-weight="600" font-family="Consolas, monospace" fill="#1e3a8a" text-anchor="middle">--lint</text>
    <text x="116" y="226" font-size="12" fill="#1e40af" text-anchor="middle">check the definition file</text>

    <line x1="236" y1="130" x2="256" y2="130" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

    <!-- Step 2: record reviews -->
    <rect x="260" y="0" width="232" height="260" rx="12" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
    <text x="376" y="30" font-size="16" font-weight="600" fill="#134e4a" text-anchor="middle">2. Record reviews</text>
    <rect x="274" y="46" width="204" height="58" rx="6" fill="#ffffff" stroke="#0d9488"/>
    <text x="376" y="70" font-size="14" font-weight="600" font-family="Consolas, monospace" fill="#134e4a" text-anchor="middle">--elaborate &lt;id&gt;</text>
    <text x="376" y="90" font-size="12" fill="#115e59" text-anchor="middle">fingerprint and file list</text>
    <rect x="274" y="114" width="204" height="58" rx="6" fill="#ffffff" stroke="#0d9488"/>
    <text x="376" y="138" font-size="14" font-weight="600" fill="#134e4a" text-anchor="middle">Review PDF keywords</text>
    <text x="376" y="158" font-size="12" fill="#115e59" text-anchor="middle">id, fingerprint, date, result</text>
    <rect x="274" y="182" width="204" height="58" rx="6" fill="#ffffff" stroke="#0d9488"/>
    <text x="376" y="206" font-size="14" font-weight="600" font-family="Consolas, monospace" fill="#134e4a" text-anchor="middle">--index "**/*.pdf"</text>
    <text x="376" y="226" font-size="12" fill="#115e59" text-anchor="middle">rebuild the index.json catalog</text>

    <line x1="496" y1="130" x2="516" y2="130" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

    <!-- Step 3: run ReviewMark -->
    <rect x="520" y="0" width="232" height="260" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="636" y="30" font-size="16" font-weight="600" fill="#92400e" text-anchor="middle">3. Run ReviewMark</text>
    <rect x="534" y="46" width="204" height="58" rx="6" fill="#ffffff" stroke="#d97706"/>
    <text x="636" y="70" font-size="14" font-weight="600" font-family="Consolas, monospace" fill="#92400e" text-anchor="middle">reviewmark CLI</text>
    <text x="636" y="90" font-size="12" font-family="Consolas, monospace" fill="#92400e" text-anchor="middle">--plan --report</text>
    <rect x="534" y="114" width="204" height="58" rx="6" fill="#ffffff" stroke="#d97706"/>
    <text x="636" y="138" font-size="14" font-weight="600" fill="#92400e" text-anchor="middle">CI pipeline</text>
    <text x="636" y="158" font-size="12" fill="#92400e" text-anchor="middle">runs on every build</text>
    <rect x="534" y="182" width="204" height="58" rx="6" fill="#ffffff" stroke="#d97706"/>
    <text x="636" y="206" font-size="14" font-weight="600" font-family="Consolas, monospace" fill="#92400e" text-anchor="middle">--affected -</text>
    <text x="636" y="226" font-size="12" fill="#92400e" text-anchor="middle">review sets hit by changed files</text>

    <line x1="756" y1="130" x2="776" y2="130" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

    <!-- Step 4: outputs -->
    <rect x="780" y="0" width="232" height="260" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="896" y="30" font-size="16" font-weight="600" fill="#5b21b6" text-anchor="middle">4. Get the results</text>
    <rect x="794" y="46" width="204" height="58" rx="6" fill="#ffffff" stroke="#7c3aed"/>
    <text x="896" y="70" font-size="14" font-weight="600" fill="#4c1d95" text-anchor="middle">Review plan</text>
    <text x="896" y="90" font-size="12" fill="#5b21b6" text-anchor="middle">coverage and uncovered files</text>
    <rect x="794" y="114" width="204" height="58" rx="6" fill="#ffffff" stroke="#7c3aed"/>
    <text x="896" y="138" font-size="14" font-weight="600" fill="#4c1d95" text-anchor="middle">Review report</text>
    <text x="896" y="158" font-size="12" fill="#5b21b6" text-anchor="middle">Current, Stale, Missing, Failed</text>
    <rect x="794" y="182" width="204" height="58" rx="6" fill="#ffffff" stroke="#7c3aed"/>
    <text x="896" y="206" font-size="14" font-weight="600" fill="#4c1d95" text-anchor="middle">Pass or fail</text>
    <text x="896" y="226" font-size="12" fill="#5b21b6" text-anchor="middle">non-zero exit with --enforce</text>

    <line x1="1016" y1="130" x2="1036" y2="130" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

    <!-- Step 5: use -->
    <rect x="1040" y="0" width="232" height="260" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="1156" y="30" font-size="16" font-weight="600" fill="#166534" text-anchor="middle">5. Use them</text>
    <rect x="1054" y="46" width="204" height="58" rx="6" fill="#ffffff" stroke="#16a34a"/>
    <text x="1156" y="70" font-size="14" font-weight="600" fill="#14532d" text-anchor="middle">Compliance evidence</text>
    <text x="1156" y="90" font-size="12" fill="#166534" text-anchor="middle">every file covered and current</text>
    <rect x="1054" y="114" width="204" height="58" rx="6" fill="#ffffff" stroke="#16a34a"/>
    <text x="1156" y="138" font-size="14" font-weight="600" fill="#14532d" text-anchor="middle">PDF documents</text>
    <text x="1156" y="158" font-size="12" fill="#166534" text-anchor="middle">published with each release</text>
    <rect x="1054" y="182" width="204" height="58" rx="6" fill="#ffffff" stroke="#16a34a"/>
    <text x="1156" y="206" font-size="14" font-weight="600" fill="#14532d" text-anchor="middle">CI gate</text>
    <text x="1156" y="226" font-size="12" fill="#166534" text-anchor="middle">blocks until reviews are current</text>

    <text x="636" y="290" font-size="13" font-style="italic" fill="#475569" text-anchor="middle">Need tool qualification evidence? Run reviewmark --validate --results validation-results.trx</text>
  </g>
</svg>
