---
# ReviewMarkConfiguration unit requirements
sections:
  - title: ReviewMark Requirements
    sections:
      - title: Configuration Requirements
        sections:
          - title: ReviewMarkConfiguration Requirements
            requirements:
              - id: ReviewMark-Config-Reading
                title: >-
                  ReviewMarkConfiguration shall read and parse the .reviewmark.yaml file into an in-memory
                  configuration model.
                justification: |
                  Enables the tool to read its configuration from the standard `.reviewmark.yaml` file,
                  exposing needs-review patterns, evidence source, and review set definitions. Review sets
                  support content-based fingerprinting to detect changes to covered files.
                tests:
                  - ReviewMarkConfiguration_Parse_NullYaml_ThrowsArgumentNullException
                  - ReviewMarkConfiguration_Parse_ValidYaml_ReturnsConfiguration
                  - ReviewMarkConfiguration_Parse_NeedsReviewPatterns_ParsedCorrectly
                  - ReviewMarkConfiguration_Parse_EvidenceSource_ParsedCorrectly
                  - ReviewMarkConfiguration_Parse_Reviews_ParsedCorrectly
                  - ReviewMarkConfiguration_Parse_EvidenceSourceWithCredentials_ParsedCorrectly
                  - ReviewMarkConfiguration_GetNeedsReviewFiles_ReturnsMatchingFiles
                  - ReviewSet_GetFingerprint_SameContent_ReturnsSameFingerprint
                  - ReviewSet_GetFingerprint_DifferentContent_ReturnsDifferentFingerprint
                  - ReviewSet_GetFingerprint_RenameFile_ReturnsSameFingerprint
                  - ReviewMarkConfiguration_Load_FileshareRelativeLocation_ResolvesToAbsolutePath
                  - ReviewMarkConfiguration_Parse_NoneEvidenceSource_ParsedCorrectly
                  - ReviewMarkConfiguration_Parse_NoneEvidenceSource_NoLocationRequired
                children:
                  - ReviewMark-OTS-YamlDotNet-Deserialize
                  - ReviewMark-OTS-YamlDotNet-ErrorHandling
                  - ReviewMark-OTS-YamlDotNet-UnknownKeys

              - id: ReviewMark-Config-EvidenceLocationExpansion
                title: >-
                  The ReviewMarkConfiguration unit shall expand ${VAR} environment variable references in
                  the evidence-source location in a single pass, leaving all other text unchanged.
                justification: |
                  Allows the evidence location to vary per environment without editing the definition
                  file. `$${` provides an escape, substituted values are never re-scanned, and text such
                  as `%20`, `$VAR`, `%VAR%`, and Windows paths must not trigger false expansion.
                tests:
                  - ReviewMarkConfiguration_Parse_EvidenceLocation_PlainVariable_Expands
                  - ReviewMarkConfiguration_Parse_EvidenceLocation_EscapedDollar_YieldsLiteral
                  - ReviewMarkConfiguration_Parse_EvidenceLocation_PercentAndLoneDollar_PassThrough
                  - ReviewMarkConfiguration_Parse_EvidenceLocation_ValueContainingToken_NotReExpanded
                  - ReviewMarkConfiguration_Parse_EvidenceLocation_WindowsPath_Preserved
                  - ReviewMarkConfiguration_Load_EvidenceLocation_ExpansionBeforeRelativeResolution_ResolvesExpanded
                  - ReviewMarkConfiguration_Parse_EvidenceLocation_ReviewSetPathsUnchanged

              - id: ReviewMark-Config-EvidenceLocationExpansionErrors
                title: >-
                  The ReviewMarkConfiguration unit shall report unset, empty, or malformed environment
                  variable references in the evidence-source location as errors naming the variable or
                  quoting the malformed reference.
                justification: |
                  A silently wrong evidence location would produce misleading review status. Parse
                  throws and Load reports an Error issue so the problem is visible in every mode.
                tests:
                  - ReviewMarkConfiguration_Parse_EvidenceLocation_UnsetVariable_Throws
                  - ReviewMarkConfiguration_Load_EvidenceLocation_UnsetVariable_ReturnsErrorIssue
                  - ReviewMarkConfiguration_Parse_EvidenceLocation_EmptyVariable_Throws
                  - ReviewMarkConfiguration_Parse_EvidenceLocation_MalformedUnclosed_Throws
                  - ReviewMarkConfiguration_Load_EvidenceLocation_MalformedInvalidName_ReturnsErrorIssue

              - id: ReviewMark-Config-EvidenceLocationExpansionNoValueDisclosure
                title: >-
                  The ReviewMarkConfiguration unit shall not include an expanded environment variable
                  value in any expansion error message or issue.
                justification: |
                  Environment variables commonly hold secrets; diagnostics must name the variable only.
                tests:
                  - ReviewMarkConfiguration_Parse_EvidenceLocation_ErrorMessage_DoesNotContainValue
                  - ReviewMarkConfiguration_Load_EvidenceLocation_ErrorIssue_DoesNotContainValue

              - id: ReviewMark-Config-EvidenceLocationExpansionNoneIgnored
                title: >-
                  The ReviewMarkConfiguration unit shall not expand or validate the location of an
                  evidence-source of type none.
                justification: |
                  The location of a `none` source is documented as optional and ignored, so an unset or
                  malformed reference there must not change existing behavior.
                tests:
                  - ReviewMarkConfiguration_Parse_EvidenceLocation_NoneSource_NotExpanded
                  - ReviewMarkConfiguration_Load_EvidenceLocation_NoneSource_NoIssue

              - id: ReviewMark-Config-Loading
                title: >-
                  The ReviewMarkConfiguration unit shall perform linting during configuration
                  loading, returning a result containing both the configuration and all
                  detected issues.
                justification: |
                  Combining configuration parsing and linting in a single loading operation ensures
                  callers receive comprehensive diagnostics without performing two separate passes.
                  All detectable issues are accumulated and returned so the caller can report all
                  problems at once.
                tests:
                  - ReviewMarkConfiguration_Load_ValidFile_ReturnsConfigurationAndNoIssues
                  - ReviewMarkConfiguration_Load_MissingEvidenceSource_ReturnsNullConfigWithErrorIssue
                  - ReviewMarkConfiguration_Load_MultipleErrors_ReturnsAllIssues
                  - ReviewMarkConfiguration_Load_NoneEvidenceSource_NoIssues
                  - ReviewMarkLoadResult_ReportIssues_RoutesIssuesToContext
                  - ReviewMarkConfiguration_Load_WhitespaceOnlyPaths_ReturnsLintError
                  - ReviewMarkConfiguration_Load_WhitespaceOnlyNeedsReviewEntry_ReturnsLintWarning
                  - ReviewMarkConfiguration_Load_WhitespaceOnlyGlobalContextEntry_ReturnsLintWarning
                  - ReviewMarkConfiguration_Load_WhitespaceOnlyPathsEntry_ReturnsLintWarning

              - id: ReviewMark-Config-LoadingNullOnError
                title: >-
                  The ReviewMarkConfiguration unit shall return a null configuration in the
                  load result when any error-level lint issue is detected.
                justification: |
                  Returning null when errors are detected allows callers to distinguish between a
                  completely invalid file and a file with only warnings. Null signals that the
                  configuration cannot be used.
                tests:
                  - ReviewMarkConfiguration_Load_NonExistentFile_ReturnsNullConfigWithErrorIssue
                  - ReviewMarkConfiguration_Load_InvalidYaml_ReturnsNullConfigWithErrorIssue
                  - ReviewMarkConfiguration_Load_MissingEvidenceSource_ReturnsNullConfigWithErrorIssue

              - id: ReviewMark-Config-PlanGeneration
                title: >-
                  The ReviewMarkConfiguration unit shall generate a Markdown review plan
                  listing all files in the needs-review set and their review-set coverage.
                justification: |
                  The tool must generate a Markdown review plan document that lists every file
                  in the needs-review file-set and identifies which review-sets provide coverage
                  for each file.
                tests:
                  - ReviewMarkConfiguration_PublishReviewPlan_AllCovered_NoIssues
                  - ReviewMarkConfiguration_PublishReviewPlan_UncoveredFiles_HasIssues

              - id: ReviewMark-Config-PlanMarkdownDepth
                title: >-
                  The ReviewMarkConfiguration unit shall apply the markdownDepth parameter to
                  control the heading level in generated review plan documents.
                justification: |
                  The heading depth controls the section heading level in the generated plan document
                  and must be within the supported range (1–5) so that subheadings do not exceed
                  the maximum Markdown heading level of 6.
                tests:
                  - ReviewMarkConfiguration_PublishReviewPlan_MarkdownDepth_UsedForHeadings

              - id: ReviewMark-Config-PlanMarkdownDepthValidation
                title: >-
                  The ReviewMarkConfiguration unit shall reject markdownDepth values above 5
                  for plan generation with ArgumentOutOfRangeException.
                justification: |
                  Subheadings in the generated plan document are at depth+1. Allowing depth > 5 would
                  require a heading level of 7 or more, which exceeds the maximum supported by Markdown.
                  Explicit validation with ArgumentOutOfRangeException surfaces the problem immediately
                  at the call site.
                tests:
                  - ReviewMarkConfiguration_PublishReviewPlan_MarkdownDepthAbove5_Throws

              - id: ReviewMark-Config-ReportGeneration
                title: >-
                  The ReviewMarkConfiguration unit shall generate a Markdown review report
                  listing each review-set and its current status.
                justification: |
                  The tool must generate a Markdown review report document that lists every
                  review-set with its current status (Current, Stale, Missing, or Failed).
                tests:
                  - ReviewMarkConfiguration_PublishReviewReport_CurrentReview_NoIssues
                  - ReviewMarkConfiguration_PublishReviewReport_StaleReview_HasIssues
                  - ReviewMarkConfiguration_PublishReviewReport_FailedReview_HasIssues
                  - ReviewMarkConfiguration_PublishReviewReport_MissingReview_HasIssues

              - id: ReviewMark-Config-ReportMarkdownDepth
                title: >-
                  The ReviewMarkConfiguration unit shall apply the markdownDepth parameter to
                  control the heading level in generated review report documents.
                justification: |
                  The heading depth controls the section heading level in the generated report document
                  and must be within the supported range (1–5) so that subheadings do not exceed
                  the maximum Markdown heading level of 6.
                tests:
                  - ReviewMarkConfiguration_PublishReviewReport_MarkdownDepth_UsedForHeadings

              - id: ReviewMark-Config-ReportMarkdownDepthValidation
                title: >-
                  The ReviewMarkConfiguration unit shall reject markdownDepth values above 5
                  for report generation with ArgumentOutOfRangeException.
                justification: |
                  Subheadings in the generated report document are at depth+1. Allowing depth > 5 would
                  require a heading level of 7 or more, which exceeds the maximum supported by Markdown.
                  Explicit validation with ArgumentOutOfRangeException surfaces the problem immediately
                  at the call site.
                tests:
                  - ReviewMarkConfiguration_PublishReviewReport_MarkdownDepthAbove5_Throws

              - id: ReviewMark-Config-Elaboration
                title: >-
                  The ReviewMarkConfiguration unit shall generate Markdown elaboration for a
                  named review set, including its ID, fingerprint, and file list.
                justification: |
                  The tool must generate a Markdown elaboration document for a named review-set,
                  containing the review-set ID, title, fingerprint, and all matched files listed
                  as inline code.
                tests:
                  - ReviewMarkConfiguration_ElaborateReviewSet_ValidId_ReturnsElaboration
                  - ReviewMarkConfiguration_ElaborateReviewSet_ContainsFullFingerprint

              - id: ReviewMark-Config-AffectedReviewSets-Matching-Sets
                title: >-
                  The ReviewMarkConfiguration unit shall map changed file paths that match needs-review
                  to the review sets whose paths match them, without accessing the file system.
                justification: |
                  Callers need to know which review sets a change affects without scanning the file
                  system, so deleted files are included. Files outside needs-review, and paths outside
                  the base directory, are ignored.
                tests:
                  - ReviewMarkConfiguration_GetAffectedReviewSets_MatchingFiles_ReturnsSetsInDefinitionOrder
                  - ReviewMarkConfiguration_GetAffectedReviewSets_NotNeedingReviewOrEmpty_ReturnsEmpty
                  - ReviewMarkConfiguration_GetAffectedReviewSets_OutsidePaths_NeitherAffectedNorUnreviewed
                children:
                  - ReviewMark-GlobMatcher-PathMatching

              - id: ReviewMark-Config-AffectedReviewSets-Matching-Order
                title: >-
                  The ReviewMarkConfiguration unit shall report affected review sets in definition order.
                justification: |
                  Deterministic output requires a stable review-set order.
                tests:
                  - ReviewMarkConfiguration_GetAffectedReviewSets_MatchingFiles_ReturnsSetsInDefinitionOrder

              - id: ReviewMark-Config-AffectedReviewSets-Matching-SortedFiles
                title: >-
                  The ReviewMarkConfiguration unit shall report the files of each affected review set
                  in sorted order.
                justification: |
                  Deterministic output requires a stable file order.
                tests:
                  - ReviewMarkConfiguration_GetAffectedReviewSets_MatchingFiles_ReturnsSetsInDefinitionOrder

              - id: ReviewMark-Config-AffectedReviewSets-Matching-ContextExcluded
                title: >-
                  The ReviewMarkConfiguration unit shall not treat a match against review-set context
                  patterns as making that review set affected.
                justification: |
                  Only review-set paths (not context) define what a review set covers.
                tests:
                  - ReviewMarkConfiguration_GetAffectedReviewSets_ContextOnlyMatch_NotAffected

              - id: ReviewMark-Config-AffectedReviewSets-Matching-NullRejected
                title: >-
                  The ReviewMarkConfiguration unit shall throw ArgumentNullException when the changed
                  path list is null.
                justification: |
                  A null list is a programming error and must be reported explicitly.
                tests:
                  - ReviewMarkConfiguration_GetAffectedReviewSets_NullPaths_ThrowsArgumentNullException

              - id: ReviewMark-Config-AffectedReviewSets-Unreviewed
                title: >-
                  The ReviewMarkConfiguration unit shall report as unreviewed the changed files that
                  match needs-review (or all files when needs-review is empty) but match no review
                  set's paths after ordered include/exclude evaluation.
                justification: |
                  Uncovered files reveal gaps in the review definition. Context patterns do not count
                  as coverage, so a file matched only by context is unreviewed.
                tests:
                  - ReviewMarkConfiguration_GetAffectedReviewSets_NeedsReviewFileInNoSet_IsUnreviewed
                  - ReviewMarkConfiguration_GetAffectedReviewSets_ContextOnlyMatch_NotAffected
                  - ReviewMarkConfiguration_GetAffectedReviewSets_EmptyNeedsReview_AllUnmatchedAreUnreviewed
                children:
                  - ReviewMark-GlobMatcher-PathMatching

              - id: ReviewMark-Config-ReportIssues-ErrorsAlwaysWritten
                title: >-
                  The ReviewMarkLoadResult shall, when requested, write lint errors to standard error
                  even when silent mode is enabled, and set the error exit code.
                justification: |
                  In --affected mode an unusable definition must be visible on standard error even with
                  --silent so a failure is never mistaken for an empty result.
                tests:
                  - ReviewMarkLoadResult_ReportIssues_AlwaysWriteErrors_Silent_WritesStderr
                  - ReviewMarkLoadResult_ReportIssues_WarningsSuppressed_ReportsErrorsOnly

              - id: ReviewMark-Config-ElaborationNullRejection
                title: >-
                  The ReviewMarkConfiguration unit shall throw ArgumentNullException for null
                  review-set ID and ArgumentException for whitespace/empty ID in
                  ElaborateReviewSet.
                justification: |
                  Null and whitespace/empty review-set IDs must be rejected with typed exceptions
                  (ArgumentNullException for null, ArgumentException for whitespace/empty) so callers
                  receive clear diagnostics at the point of the invalid call.
                tests:
                  - ReviewMarkConfiguration_ElaborateReviewSet_NullId_ThrowsArgumentNullException
                  - ReviewMarkConfiguration_ElaborateReviewSet_WhitespaceId_ThrowsArgumentException

              - id: ReviewMark-Config-ElaborationUnknownIdRejection
                title: >-
                  The ReviewMarkConfiguration unit shall throw ArgumentException when
                  ElaborateReviewSet is called with an ID that does not exist in the
                  configuration.
                justification: |
                  An unrecognized review-set ID is a programming error that cannot be resolved without
                  correcting the caller. Throwing ArgumentException with a clear message enables callers
                  to detect and report the mistake immediately rather than silently producing empty output.
                tests:
                  - ReviewMarkConfiguration_ElaborateReviewSet_UnknownId_ThrowsArgumentException

              - id: ReviewMark-Config-ElaborationMarkdownDepth
                title: >-
                  The ReviewMarkConfiguration unit shall apply the markdownDepth parameter to
                  control the heading level in generated elaboration documents.
                justification: |
                  The heading depth controls the heading level in the generated elaboration document
                  and must be within the supported range (1–5) so that subheadings do not exceed
                  the maximum Markdown heading level of 6.
                tests:
                  - ReviewMarkConfiguration_ElaborateReviewSet_MarkdownDepth_UsedForHeadings

              - id: ReviewMark-Config-ElaborationMarkdownDepthValidation
                title: >-
                  The ReviewMarkConfiguration unit shall reject markdownDepth values above 5
                  for elaboration with ArgumentOutOfRangeException.
                justification: |
                  Subheadings in the generated elaboration document are at depth+1. Allowing depth > 5
                  would require a heading level of 7 or more, which exceeds the maximum supported by
                  Markdown. Explicit validation with ArgumentOutOfRangeException surfaces the problem
                  immediately at the call site.
                tests:
                  - ReviewMarkConfiguration_ElaborateReviewSet_MarkdownDepthAbove5_Throws

              - id: ReviewMark-Config-ContextParsing
                title: >-
                  The ReviewMarkConfiguration unit shall parse an optional top-level context: list
                  and an optional per-review-set context: list from .reviewmark.yaml.
                justification: |
                  Context entries provide reference material for reviewers and follow the same
                  glob-pattern syntax as paths: entries.
                tests:
                  - ReviewMarkConfiguration_Parse_GlobalContext_ParsedCorrectly
                  - ReviewMarkConfiguration_Parse_ReviewSetContext_ParsedCorrectly
                  - ReviewMarkConfiguration_Parse_NoContext_DefaultsToEmpty

              - id: ReviewMark-Config-ContextExcludedFromFingerprint
                title: >-
                  Context files shall not be included when computing a review set's fingerprint.
                justification: |
                  Changing context files (reference material) must not mark a review stale.
                tests:
                  - ReviewSet_GetFingerprint_ContextNotIncluded

              - id: ReviewMark-Config-ContextExcludedFromCoverage
                title: >-
                  Context entries shall provide reference material only and shall not satisfy
                  needs-review coverage obligations; only paths: entries provide review coverage.
                justification: >-
                  A file appearing solely in context: is reference material shown during elaboration.
                  It is not a file under review. A file that matches needs-review and appears only
                  in context: — and not in any paths: entry — will still be reported as uncovered
                  by PublishReviewPlan(). Only files resolved through a review set's paths: entries
                  count as covered.
                tests:
                  - ReviewMarkConfiguration_ElaborateReviewSet_ContextNotUnderReview
                  - ReviewMarkConfiguration_PublishReviewPlan_ContextOnlyFile_StillReportedAsUncovered

              - id: ReviewMark-Config-ContextInElaboration
                title: >-
                  ElaborateReviewSet shall include a Context subsection listing all resolved context
                  files as plain paths, omitting the subsection when no context files exist.
                justification: |
                  Reviewers need to know which reference files to consult before assessing
                  the files under review.
                tests:
                  - ReviewMarkConfiguration_ElaborateReviewSet_GlobalContext_AppearsInOutput
                  - ReviewMarkConfiguration_ElaborateReviewSet_LocalContext_AppearsInOutput
                  - ReviewMarkConfiguration_ElaborateReviewSet_NoContext_ContextSectionOmitted
                  - ReviewMarkConfiguration_ElaborateReviewSet_BothGlobalAndLocalContextAppear

              - id: ReviewMark-Config-ContextDeduplication
                title: >-
                  ElaborateReviewSet shall suppress from the Context subsection any file that also
                  appears in the review set's Files list, so that no file is presented with
                  conflicting purpose in the same elaboration output.
                justification: |
                  A file listed in global context (e.g. docs/design/introduction.md) is normally
                  reference material. However, when a review set explicitly includes that same file
                  in its paths:, it is under review for that set. Showing it in both sections
                  simultaneously presents contradictory guidance. Suppressing it from context
                  ensures the file's purpose is unambiguous in every elaboration output.
                tests:
                  - ReviewMarkConfiguration_ElaborateReviewSet_FileInBothContextAndPaths_SuppressedFromContext
                  - ReviewMarkConfiguration_ElaborateReviewSet_ContextFileNotInPaths_NotSuppressed

              - id: ReviewMark-Config-ContextExclusionPatterns
                title: >-
                  ElaborateReviewSet shall treat global and per-review-set context patterns as a
                  single ordered sequence, allowing per-review-set exclusion patterns (prefixed
                  with !) to suppress files added by the global context.
                justification: |
                  Global context adds reference files for every review set. Occasionally a specific
                  review set does not need a globally-added file — for example, the Purpose review
                  set may want to exclude docs/design/introduction.md that every other review set
                  finds useful. By resolving the combined [global + per-review-set] context pattern
                  list in order (leveraging GlobMatcher's existing ordered include/exclude semantics),
                  per-review-set exclusions can selectively suppress global context files without
                  requiring changes to the global configuration.
                tests:
                  - ReviewMarkConfiguration_ElaborateReviewSet_PerSetContextExcludesGlobalFile
                  - ReviewMarkConfiguration_ElaborateReviewSet_ExclusionDoesNotAffectOtherReviewSets

              - id: ReviewMark-Config-PathsConstrainedToNeedsReview
                title: >-
                  Review set paths resolution shall be constrained to the needs-review file set
                  when needs-review patterns are present, ensuring review set files are a
                  subset of files declared as needing review.
                justification: >-
                  The needs-review list is the canonical declaration of which files require review.
                  A review set's paths: list is semantically a partition of that set. Constraining
                  paths resolution to needs-review ensures that build artifacts, generated files, and
                  other excluded paths cannot enter a review set even when a broad glob pattern is
                  used. The same constraint applies to fingerprint computation, so that adding a
                  build artifact to a directory does not change the fingerprint and does not
                  invalidate a valid review.
                tests:
                  - ReviewSet_GetFiles_WithConstraint_ExcludesFilesOutsideConstraint
                  - ReviewSet_GetFingerprint_WithConstraint_ExcludesBuildArtifacts
                  - ReviewMarkConfiguration_PublishReviewPlan_ReviewSetExcludesBuildArtifacts
                  - ReviewMarkConfiguration_PublishReviewReport_FingerprintConsistentWithPlan

              - id: ReviewMark-Config-GetFilesUnconstrainedWhenNoConstraint
                title: >-
                  Review set GetFiles shall return all glob-matched files without filtering when
                  no constraint is provided, preserving backward compatibility.
                justification: >-
                  When called without a constraint (null), GetFiles returns all files matched by the
                  review set's glob patterns regardless of needs-review. This preserves the
                  pre-constraint behavior and ensures that callers that do not supply a constraint
                  receive the complete unconstrained file list.
                tests:
                  - ReviewSet_GetFiles_WithoutConstraint_ReturnsAllMatchedFiles

              - id: ReviewMark-Config-NeedsReviewAbsentUnconstrained
                title: >-
                  When the needs-review patterns list is absent or empty, the tool shall apply no
                  constraint to review set paths resolution, preserving backward compatibility for
                  configurations that omit needs-review.
                justification: >-
                  Configurations written before needs-review was introduced have no
                  needs-review block. Treating an absent or empty needs-review as "no constraint"
                  ensures those configurations continue to work without modification. Only a
                  non-empty needs-review list produces a constraint.
                tests:
                  - ReviewSet_GetFiles_WithoutConstraint_ReturnsAllMatchedFiles
