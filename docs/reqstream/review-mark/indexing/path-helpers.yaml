---
# PathHelpers unit requirements
sections:
  - title: ReviewMark Requirements
    sections:
      - title: Indexing Requirements
        sections:
          - title: PathHelpers Requirements
            requirements:
              - id: ReviewMark-PathHelpers-SafeCombine
                title: The PathHelpers shall safely combine a base path and a relative path.
                justification: |
                  When constructing file paths from user-supplied or externally-sourced components
                  (such as relative paths read from an evidence index), the tool must be able to
                  combine a base directory path with a relative path to produce a valid combined
                  path (the caller's relative or absolute style is preserved). This is a
                  prerequisite for any subsequent path-traversal validation.
                tests:
                  - PathHelpers_SafePathCombine_ValidPaths_CombinesCorrectly
                  - PathHelpers_SafePathCombine_NestedPaths_CombinesCorrectly
                  - PathHelpers_SafePathCombine_CurrentDirectoryReference_CombinesCorrectly
                  - PathHelpers_SafePathCombine_EmptyRelativePath_ReturnsBasePath

              - id: ReviewMark-PathHelpers-TraversalRejection
                title: The PathHelpers shall reject path traversal attempts by throwing ArgumentException.
                justification: |
                  When combining paths from user-supplied or externally-sourced components, the tool
                  must prevent path traversal attacks. The combined path must be verified to remain
                  within the base directory, ensuring that no input can cause access to files outside
                  the intended directory scope. This includes rejection of relative traversal segments
                  (such as `..`) and absolute path injection.
                tests:
                  - PathHelpers_SafePathCombine_PathTraversalWithDoubleDots_ThrowsArgumentException
                  - PathHelpers_SafePathCombine_DoubleDotsInMiddle_ThrowsArgumentException
                  - PathHelpers_SafePathCombine_AbsoluteUnixPath_ThrowsArgumentException
                  - windows@PathHelpers_SafePathCombine_AbsoluteWindowsPath_ThrowsArgumentException

              - id: ReviewMark-PathHelpers-NullRejection
                title: "The PathHelpers shall reject null inputs by throwing ArgumentNullException."
                justification: |
                  When basePath or relativePath is null, the operation must be rejected with a
                  clear error so the caller can report a diagnostic rather than encountering an
                  unhandled error.
                tests:
                  - PathHelpers_SafePathCombine_NullBasePath_ThrowsArgumentNullException
                  - PathHelpers_SafePathCombine_NullRelativePath_ThrowsArgumentNullException

              - id: ReviewMark-PathHelpers-ChangedPaths-Parse-Separator
                title: >-
                  The PathHelpers shall parse a changed-file list, auto-detecting NUL or newline
                  separation, and return an empty result for empty input.
                justification: |
                  Changed-file lists come from tools such as git: LF, CRLF, or NUL separators
                  (git -z); in NUL mode CR and LF are part of the name.
                tests:
                  - PathHelpers_ParseChangedPaths_NewlineSeparated_PreservesWhitespaceRemovesCrAndSorts
                  - PathHelpers_ParseChangedPaths_NulSeparated_SplitsOnNul
                  - PathHelpers_ParseChangedPaths_EmptyInput_ReturnsEmpty

              - id: ReviewMark-PathHelpers-ChangedPaths-Parse-Transport
                title: >-
                  The PathHelpers shall remove one leading byte-order mark and, in newline mode, one
                  trailing CR per entry from a changed-file list.
                justification: |
                  A BOM and CR are transport artifacts of files produced on different platforms and
                  must not become part of a path.
                tests:
                  - PathHelpers_ParseChangedPaths_BomAndCrOnly_Removed
                  - PathHelpers_ParseChangedPaths_NewlineSeparated_PreservesWhitespaceRemovesCrAndSorts

              - id: ReviewMark-PathHelpers-ChangedPaths-Parse-Whitespace
                title: >-
                  The PathHelpers shall preserve leading, trailing and whitespace-only content of
                  changed-file entries.
                justification: |
                  Whitespace can be significant in real file names, so only transport artifacts are removed.
                tests:
                  - PathHelpers_ParseChangedPaths_LeadingTrailingSpaces_Preserved
                  - PathHelpers_ParseChangedPaths_WhitespaceOnlyEntry_Kept

              - id: ReviewMark-PathHelpers-ChangedPaths-Parse-NullRejected
                title: >-
                  The PathHelpers shall throw ArgumentNullException when ParseChangedPaths or
                  NormalizeChangedPath receives a null argument.
                justification: |
                  Null arguments are programming errors and must be reported explicitly.
                tests:
                  - PathHelpers_ParseChangedPaths_NullText_ThrowsArgumentNullException
                  - PathHelpers_ParseChangedPaths_NullDirectory_ThrowsArgumentNullException
                  - PathHelpers_NormalizeChangedPath_NullPath_ThrowsArgumentNullException
                  - PathHelpers_NormalizeChangedPath_NullDirectory_ThrowsArgumentNullException

              - id: ReviewMark-PathHelpers-ChangedPaths-Normalize-Separators
                title: >-
                  The PathHelpers shall normalize each changed path to forward slashes (converting
                  backslashes only where backslash is the directory separator) without leading ./
                  segments.
                justification: |
                  Normalizing makes glob matching deterministic, while preserving backslash as a valid
                  file-name character on POSIX platforms.
                tests:
                  - PathHelpers_NormalizeChangedPath_BackslashesAndDotSlash_Normalized

              - id: ReviewMark-PathHelpers-ChangedPaths-Normalize-Absolute
                title: >-
                  The PathHelpers shall make absolute changed paths under the directory relative and
                  retain absolute paths outside the directory unchanged (apart from platform separator
                  conversion); an absolute or relative path containing a .. segment shall never be
                  canonicalized into a matching path.
                justification: |
                  Absolute paths outside the working directory cannot be made relative, so they are
                  kept as text and are never matched by any glob. A .. segment is rejected before
                  relativizing, so absolute and relative inputs follow the same rule.
                tests:
                  - PathHelpers_NormalizeChangedPath_AbsolutePath_MadeRelativeToDirectory
                  - PathHelpers_NormalizeChangedPath_AbsoluteOutsideDirectory_RetainedUnchanged
                  - PathHelpers_NormalizeChangedPath_ParentSegment_NeverMatches

              - id: ReviewMark-PathHelpers-ChangedPaths-Dedupe
                title: >-
                  The PathHelpers shall return changed paths de-duplicated after normalization and
                  sorted ordinally.
                justification: |
                  Different spellings of the same path (a, ./a, .\a) must produce a single, deterministic entry.
                tests:
                  - PathHelpers_ParseChangedPaths_DuplicateForms_Deduplicated

              - id: ReviewMark-PathHelpers-ChangedPaths-Escape
                title: >-
                  The PathHelpers shall escape backslash, TAB, LF and CR in record fields as
                  \\, \t, \n and \r in a reversible way.
                justification: |
                  Record fields may contain delimiter characters; reversible escaping keeps the
                  tab-delimited output unambiguous.
                tests:
                  - PathHelpers_EscapeRecordField_SpecialCharacters_EscapedAndReversible
                  - PathHelpers_EscapeRecordField_Null_ThrowsArgumentNullException
