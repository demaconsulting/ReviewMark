---
# Context unit requirements
sections:
  - title: ReviewMark Requirements
    sections:
      - title: Cli Requirements
        sections:
          - title: Context Requirements
            requirements:
              - id: ReviewMark-Context-Parsing
                title: >-
                  The Context unit shall parse command-line arguments into a structured
                  representation of the requested operation and its options.
                justification: |
                  All downstream processing reads options from the parsed representation rather than
                  directly from the raw argument array. Arguments are processed sequentially,
                  recognizing flag and value arguments. Unknown arguments must cause an error so
                  the caller can report a clear diagnostic.
                tests:
                  - Context_Create_NoArguments_ReturnsDefaultContext
                  - Context_Create_VersionFlag_SetsVersionTrue
                  - Context_Create_ShortVersionFlag_SetsVersionTrue
                  - Context_Create_HelpFlag_SetsHelpTrue
                  - Context_Create_ShortHelpFlag_H_SetsHelpTrue
                  - Context_Create_ShortHelpFlag_Question_SetsHelpTrue
                  - Context_Create_SilentFlag_SetsSilentTrue
                  - Context_Create_ValidateFlag_SetsValidateTrue
                  - Context_Create_ResultsFlag_SetsResultsFile
                  - Context_Create_ResultsFlag_WithoutValue_ThrowsArgumentException
                  - Context_Create_ResultAlias_SetsResultsFile
                  - Context_Create_ResultAlias_WithoutValue_ThrowsArgumentException
                  - Context_Create_LogFlag_OpensLogFile
                  - Context_Create_LogFlag_WithoutValue_ThrowsArgumentException
                  - Context_Create_UnknownArgument_ThrowsArgumentException
                  - Context_Create_DefinitionFlag_SetsDefinitionFile
                  - Context_Create_DefinitionFlag_WithoutValue_ThrowsArgumentException
                  - Context_Create_PlanFlag_SetsPlanFile
                  - Context_Create_PlanDepthFlag_SetsPlanDepth
                  - Context_Create_PlanDepthFlag_WithInvalidValue_ThrowsArgumentException
                  - Context_Create_PlanDepthFlag_WithZeroValue_ThrowsArgumentException
                  - Context_Create_PlanDepthFlag_WithValueGreaterThanFive_ThrowsArgumentException
                  - Context_Create_ReportFlag_SetsReportFile
                  - Context_Create_ReportDepthFlag_SetsReportDepth
                  - Context_Create_ReportDepthFlag_NonNumeric_ThrowsArgumentException
                  - Context_Create_ReportDepthFlag_Zero_ThrowsArgumentException
                  - Context_Create_ReportDepthFlag_MissingValue_ThrowsArgumentException
                  - Context_Create_ReportDepthFlag_WithValueGreaterThanFive_ThrowsArgumentException
                  - Context_Create_IndexFlag_AddsIndexPath
                  - Context_Create_IndexFlag_MultipleTimes_AddsAllPaths
                  - Context_Create_NoArguments_IndexPathsEmpty
                  - Context_Create_NoArguments_PlanDepthDefaultsToOne
                  - Context_Create_NoArguments_ReportDepthDefaultsToOne
                  - Context_Create_EnforceFlag_SetsEnforceTrue
                  - Context_Create_NoArguments_EnforceFalse
                  - Context_Create_DirFlag_SetsWorkingDirectory
                  - Context_Create_NoArguments_WorkingDirectoryIsNull
                  - Context_Create_DirFlag_MissingValue_ThrowsArgumentException
                  - Context_Create_ElaborateFlag_SetsElaborateId
                  - Context_Create_NoArguments_ElaborateIdIsNull
                  - Context_Create_ElaborateFlag_WithoutValue_ThrowsArgumentException
                  - Context_Create_LintFlag_SetsLintTrue
                  - Context_Create_NoArguments_LintIsFalse
                  - Context_Create_DepthFlag_SetsDepth
                  - Context_Create_DepthFlag_PlanDepthOverride
                  - Context_Create_DepthFlag_ReportDepthOverride
                  - Context_Create_DepthFlag_WithInvalidValue_ThrowsArgumentException
                  - Context_Create_DepthFlag_WithZeroValue_ThrowsArgumentException
                  - Context_Create_DepthFlag_WithValueGreaterThanFive_ThrowsArgumentException
                  - Context_Create_DepthFlag_MissingValue_ThrowsArgumentException
                  - Context_Create_PlanFlag_WithoutValue_ThrowsArgumentException
                  - Context_Create_ReportFlag_WithoutValue_ThrowsArgumentException
                  - Context_Create_IndexFlag_WithoutValue_ThrowsArgumentException

              - id: ReviewMark-Context-AffectedValue
                title: >-
                  The Context unit shall parse --affected with a value (a file path or '-' for
                  standard input) into AffectedFile.
                justification: |
                  The Program unit needs the changed-file list source; '-' selects standard input.
                tests:
                  - Context_Create_AffectedFlag_SetsAffectedFile
                  - Context_Create_AffectedFlag_Dash_SetsAffectedFileToDash
                  - Context_Create_NoArguments_AffectedFileIsNull
                  - Context_Create_AffectedFlag_SingleDashPrefixedValue_Accepted

              - id: ReviewMark-Context-AffectedValue-Missing
                title: >-
                  The Context unit shall throw ArgumentException when --affected has no value.
                justification: |
                  A missing value is a usage error.
                tests:
                  - Context_Create_AffectedFlag_WithoutValue_ThrowsArgumentException

              - id: ReviewMark-Context-AffectedValue-Invalid
                title: >-
                  The Context unit shall throw ArgumentException when the --affected value is empty,
                  whitespace-only or starts with '--'.
                justification: |
                  An option-like value (for example --affected --lint) is almost certainly a missing
                  filename; rejecting it avoids silently consuming the next option. Files whose names
                  start with -- can be given as ./--name.
                tests:
                  - Context_Create_AffectedFlag_InvalidValue_ThrowsArgumentException

              - id: ReviewMark-Context-AffectedExclusive
                title: >-
                  The Context unit shall throw ArgumentException when --affected is combined with
                  --plan, --report, --elaborate, --index or --lint.
                justification: |
                  --affected is an exclusive operation; rejecting ambiguous combinations at parse time
                  keeps the one-operation-per-invocation rule and produces a clear error.
                tests:
                  - Context_Create_AffectedWithExclusiveOperation_ThrowsArgumentException

              - id: ReviewMark-Context-AffectedModifiers
                title: >-
                  The Context unit shall allow --affected to be combined with --definition, --dir,
                  --silent and --log.
                justification: |
                  These options modify how the single operation runs and do not select another operation.
                tests:
                  - Context_Create_AffectedWithDefinitionDirSilent_Succeeds

              - id: ReviewMark-Context-ErrorOutput-Forced
                title: >-
                  The Context unit shall write an error to standard error even in silent mode when
                  WriteError is called with alwaysWriteToConsole, and set the error exit code.
                justification: |
                  Failures in --affected mode must stay visible under --silent, which otherwise
                  suppresses console output.
                tests:
                  - Context_WriteError_AlwaysWriteToConsole_Silent_WritesStderrAndSetsExitCode

              - id: ReviewMark-Context-LogFileError
                title: The Context unit shall throw InvalidOperationException when the log file cannot be opened.
                justification: |
                  If the log file path is invalid or the parent directory does not exist, the
                  Context cannot fulfil its logging contract. Throwing InvalidOperationException
                  wrapping the underlying file-system exception gives callers a typed signal that
                  the tool cannot start, enabling Program.Main to convert it into a clean error
                  exit with an actionable message rather than an unhandled exception crash.
                tests:
                  - Context_Create_LogFlag_InvalidPath_ThrowsInvalidOperationException

              - id: ReviewMark-Context-Output
                title: >-
                  The Context unit shall provide unified output and error logging, respecting
                  the --silent flag and optional --log file.
                justification: |
                  All output goes through the Context so that the --silent flag is honoured and
                  optionally duplicated to a log file opened by the --log flag. Error output must
                  additionally set the error exit code so that the process exits with a non-zero
                  status when any error is reported.
                tests:
                  - Context_WriteLine_NotSilent_WritesToConsole
                  - Context_WriteLine_Silent_DoesNotWriteToConsole
                  - Context_WriteError_NotSilent_WritesToConsole
                  - Context_WriteError_Silent_DoesNotWriteToConsole
                  - Context_WriteError_SetsErrorExitCode
                  - Context_WriteError_WritesToLogFile
